[project]
name = "ceia-aisdk"
version = "0.1.0"
description = "CEIA AI SDK for local GGUF chat on Linux x86_64. Weights are downloaded at runtime and are not included in the wheel."
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["ceia", "sdk", "diagnostics", "cuda", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "llama-cpp-python>=0.3.35",
    "pyyaml>=6.0.3",
    "rich>=13.9",
    "typer>=0.16",
]

[project.optional-dependencies]
cuda = [
    "llama-cpp-python>=0.3.35",
]

[project.urls]
Homepage = "https://github.com/ratacheski/ceia-aisdk"
Documentation = "https://github.com/ratacheski/ceia-aisdk#readme"
Repository = "https://github.com/ratacheski/ceia-aisdk"
Issues = "https://github.com/ratacheski/ceia-aisdk/issues"
Changelog = "https://github.com/ratacheski/ceia-aisdk/releases"

[project.scripts]
ceia-aisdk = "ceia_aisdk.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6",
    "codespell>=2.4",
    "pydoclint>=0.6",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.12",
    "twine>=6.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "ceia_aisdk"
module-root = "src"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--disable-socket", "--allow-unix-socket", "-ra"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "D",
    "E",
    "F",
    "I",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pydoclint]
style = "google"
exclude = '\.venv|\.git'
require-return-section-when-returning-nothing = false
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-arg-order = true
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
skip-checking-short-docstrings = false
skip-checking-raises = true

[tool.codespell]
skip = ".git,.venv,uv.lock,dist,*.egg-info,.ruff_cache,.pytest_cache,.specify"
ignore-words-list = "aisdk,comando,erro"

[tool.check-wheel-contents]
toplevel = ["ceia_aisdk"]
ignore = ["W002"]
